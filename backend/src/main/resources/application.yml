server:
  port: ${PORT:8080}

spring:
  application:
    name: nia-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/nia}
      database: ${MONGODB_DB_NAME:nia}

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  jwt-secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}